<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misión Cumpleaños Evan - 6 Años</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020617; color: white;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; touch-action: none;
        }
        
        .font-space { font-family: 'Orbitron', sans-serif; }
        
        #app-container {
            position: relative; width: 100%; height: 100%; max-width: 600px; margin: 0 auto;
            background: #000; overflow: hidden; box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
        }

        /* FONDO DE EVAN CORREGIDO */
        #space-bg {
            position: absolute; inset: 0; z-index: 0;
            background-image: url('fondo_evan.jpg'); /* NOMBRE DE ARCHIVO SIMPLIFICADO */
            background-size: cover; background-position: center top;
            opacity: 0.35; filter: contrast(1.2) brightness(0.8);
        }

        /* GALAXIAS (NEBULOSAS ANIMADAS) */
        .galaxy {
            position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; z-index: 1;
            animation: drift 20s infinite alternate ease-in-out;
        }
        .galaxy-1 { top: -10%; left: -20%; width: 300px; height: 300px; background: #8b5cf6; }
        .galaxy-2 { bottom: -10%; right: -20%; width: 400px; height: 400px; background: #3b82f6; animation-delay: -5s; }
        .galaxy-3 { top: 40%; left: 30%; width: 250px; height: 250px; background: #ec4899; animation-delay: -10s; }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.2); }
        }

        /* ESTRELLAS ANIMADAS */
        .stars { position: absolute; inset: 0; z-index: 2; background: transparent; }
        .stars::after {
            content: ""; position: absolute; top: -100px; left: 0; width: 100%; height: 200%;
            background-image: radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)), radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 200px 200px;
            animation: moveStars 10s linear infinite; opacity: 0.7;
        }
        @keyframes moveStars { from { transform: translateY(0); } to { transform: translateY(200px); } }

        canvas { position: absolute; inset: 0; z-index: 10; display: none; }

        /* PANTALLAS DE INTERFAZ */
        .screen {
            position: absolute; inset: 0; z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(5px);
            transition: opacity 0.5s; padding: 20px; text-align: center;
        }
        .hidden-screen { opacity: 0; pointer-events: none; }

        .btn-space {
            background: linear-gradient(45deg, #0284c7, #2563eb);
            border: 2px solid #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            padding: 12px 30px; border-radius: 50px; font-weight: bold;
            letter-spacing: 2px; text-transform: uppercase; transition: transform 0.2s; cursor: pointer;
        }
        .btn-space:active { transform: scale(0.95); }

        .input-space {
            width: 100%; max-width: 300px; background: rgba(15, 23, 42, 0.8);
            border: 2px solid #38bdf8; color: white; padding: 15px;
            border-radius: 10px; font-size: 1.1rem; text-align: center; outline: none;
            box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.3); margin-bottom: 20px;
        }
        .input-space:focus { border-color: #fcd34d; box-shadow: inset 0 0 10px rgba(252, 211, 77, 0.5); }
        
        #hud {
            position: absolute; top: 15px; right: 15px; z-index: 15;
            font-family: 'Orbitron', sans-serif; color: #fcd34d; font-size: 1.2rem;
            text-shadow: 0 0 5px rgba(252, 211, 77, 0.8); display: none;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="space-bg"></div>
    <div class="galaxy galaxy-1"></div>
    <div class="galaxy galaxy-2"></div>
    <div class="galaxy galaxy-3"></div>
    <div class="stars"></div>

    <div id="hud">Ruta: 0%</div>

    <!-- PANTALLA 1: REGISTRO DEL CADETE -->
    <div id="screen-intro" class="screen">
        <h1 class="font-space text-4xl text-sky-400 mb-2 drop-shadow-[0_0_10px_rgba(56,189,248,0.8)]">MISIÓN EVAN</h1>
        <h2 class="font-space text-2xl text-yellow-400 mb-8 tracking-widest">6 AÑOS</h2>
        <p class="mb-4 text-sm text-gray-300 font-light tracking-wide">Identificación requerida para abordar:</p>
        <input type="text" id="guestName" class="input-space font-space" placeholder="Tu Nombre y Apellido" autocomplete="off">
        <button id="btnStart" class="btn-space font-space mt-4 text-white">INICIAR MISIÓN</button>
    </div>

    <!-- EL JUEGO (CANVAS) -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI DEL JUEGO (INSTRUCCIONES FLOTANTES) -->
    <div id="game-ui" class="absolute top-4 left-0 w-full z-20 pointer-events-none hidden-screen text-center">
        <p id="ui-message" class="font-space text-yellow-400 text-sm drop-shadow-md animate-pulse">¡DESTRUYE LOS METEORITOS!</p>
        <p class="text-xs text-white mt-1">Arrastra para mover 🚀 • Toca para disparar 💥</p>
    </div>

    <!-- PANTALLA 3: RESULTADO Y ENVÍO -->
    <div id="screen-result" class="screen hidden-screen">
        <div id="result-icon" class="text-6xl mb-4"></div>
        <h2 id="result-title" class="font-space text-3xl mb-4 drop-shadow-lg"></h2>
        <p id="result-msg" class="text-gray-300 mb-8 max-w-xs text-sm leading-relaxed"></p>
        
        <!-- BOTÓN PARA ENVIAR WHATSAPP -->
        <a href="#" id="btnConfirm" target="_blank" class="btn-space font-space text-white flex items-center justify-center gap-2">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            ENVIAR REPORTE
        </a>
    </div>
</div>

<script>
    // --- CONFIGURACIÓN ---
    const WHATSAPP_NUMBER = "573000000000"; 
    
    // VARIABLES DEL JUEGO
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gameLoopId;
    let isPlaying = false;
    let guestName = "";
    
    // Motor de Audio (Sintetizador web)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'explode') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'alert') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }
    }

    // Entidades
    let ship = { x: 0, y: 0, size: 50 };
    let bullets = [];
    let particles = [];
    let asteroids = [];
    let targets = [];
    
    // Progreso del juego
    let score = 0;
    const WIN_SCORE = 5; // 5 meteoritos para pasar de nivel
    let phase = 1; // 1: Meteoritos, 2: Decisión

    function resizeCanvas() {
        const container = document.getElementById('app-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        ship.y = canvas.height - 80;
        if(ship.x === 0) ship.x = canvas.width / 2;
    }
    window.addEventListener('resize', resizeCanvas);

    function initTargets() {
        playSound('alert');
        document.getElementById('ui-message').innerText = "¡DISPARA A TU RESPUESTA!";
        document.getElementById('ui-message').classList.replace('text-yellow-400', 'text-sky-400');
        document.getElementById('hud').style.display = 'none';
        
        targets = [
            { id: 'yes', text: 'SÍ ASISTO', emoji: '🟢', x: canvas.width * 0.25, y: -50, targetY: 150, radius: 45, color: '#10b981', glow: '#059669', yOffset: 0, angle: 0 },
            { id: 'no', text: 'NO ASISTO', emoji: '🔴', x: canvas.width * 0.75, y: -50, targetY: 150, radius: 45, color: '#ef4444', glow: '#b91c1c', yOffset: 0, angle: Math.PI }
        ];
    }

    function update() {
        if(!isPlaying) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Actualizar UI de progreso
        if (phase === 1) {
            document.getElementById('hud').innerText = `Ruta: ${score * 20}%`;
            // Generar meteoritos
            if(Math.random() < 0.03) {
                asteroids.push({
                    x: Math.random() * (canvas.width - 40) + 20, y: -30,
                    radius: Math.random() * 15 + 15, speed: Math.random() * 2 + 2, rot: 0
                });
            }
        }

        // Balas
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y -= b.speed;
            ctx.shadowBlur = 10; ctx.shadowColor = '#38bdf8'; ctx.fillStyle = '#bae6fd';
            ctx.fillRect(b.x - 2, b.y, 4, 20); ctx.shadowBlur = 0;
            if (b.y < 0) bullets.splice(i, 1);
        }

        // Fase 1: Meteoritos (Rocas grises)
        if (phase === 1) {
            for (let i = asteroids.length - 1; i >= 0; i--) {
                let a = asteroids[i];
                a.y += a.speed; a.rot += 0.05;
                
                ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
                ctx.fillStyle = '#64748b'; ctx.beginPath();
                // Dibujar forma irregular
                ctx.moveTo(0, -a.radius); ctx.lineTo(a.radius, -a.radius/2); ctx.lineTo(a.radius, a.radius/2);
                ctx.lineTo(0, a.radius); ctx.lineTo(-a.radius, a.radius/2); ctx.lineTo(-a.radius, -a.radius/2);
                ctx.closePath(); ctx.fill(); ctx.restore();

                // Colisión Bala vs Meteorito
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (Math.hypot(bullets[j].x - a.x, bullets[j].y - a.y) < a.radius + 10) {
                        createExplosion(a.x, a.y, '#94a3b8');
                        bullets.splice(j, 1); asteroids.splice(i, 1);
                        playSound('explode');
                        score++;
                        if (score >= WIN_SCORE) { phase = 2; asteroids = []; initTargets(); }
                        break;
                    }
                }
                if (asteroids[i] && asteroids[i].y > canvas.height + 50) asteroids.splice(i, 1);
            }
        }

        // Fase 2: Planetas de Decisión
        if (phase === 2) {
            targets.forEach(t => {
                if (t.y < t.targetY) t.y += 2; // Bajan suavemente
                t.angle += 0.03; t.yOffset = Math.sin(t.angle) * 10;
                
                ctx.shadowBlur = 20; ctx.shadowColor = t.glow; ctx.fillStyle = t.color;
                ctx.beginPath(); ctx.arc(t.x, t.y + t.yOffset, t.radius, 0, Math.PI * 2); ctx.fill();
                
                ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px Montserrat';
                ctx.textAlign = 'center'; ctx.fillText(t.text, t.x, t.y + t.yOffset + 5);
            });

            // Colisión Bala vs Planeta
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                for (let j = targets.length - 1; j >= 0; j--) {
                    let t = targets[j];
                    if (Math.hypot(b.x - t.x, b.y - (t.y + t.yOffset)) < t.radius) {
                        createExplosion(t.x, t.y + t.yOffset, t.color);
                        playSound('explode');
                        bullets.splice(i, 1);
                        endGame(t.id);
                        return;
                    }
                }
            }
        }

        // Nave
        ctx.font = `${ship.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🚀', ship.x, ship.y);

        // Partículas
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 2;
            ctx.fillStyle = `rgba(255, 255, 255, ${p.life / 100})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            if (p.life <= 0) particles.splice(i, 1);
        }

        gameLoopId = requestAnimationFrame(update);
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<40; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
                life: 100, size: Math.random() * 4 + 2
            });
        }
    }

    function fireBullet() {
        if(!isPlaying) return;
        playSound('shoot');
        bullets.push({ x: ship.x, y: ship.y - 30, speed: 12 });
    }

    // Controles
    const appContainer = document.getElementById('app-container');
    appContainer.addEventListener('touchmove', (e) => {
        if(!isPlaying) return;
        e.preventDefault(); 
        ship.x = e.touches[0].clientX - canvas.getBoundingClientRect().left;
    }, {passive: false});

    appContainer.addEventListener('mousemove', (e) => {
        if(!isPlaying) return;
        ship.x = e.clientX - canvas.getBoundingClientRect().left;
    });

    appContainer.addEventListener('touchstart', (e) => {
        if(!['INPUT', 'BUTTON', 'A'].includes(e.target.tagName)) fireBullet();
    });
    
    appContainer.addEventListener('mousedown', (e) => {
        if(!['INPUT', 'BUTTON', 'A'].includes(e.target.tagName)) fireBullet();
    });

    // Inicio y Fin de juego
    document.getElementById('btnStart').addEventListener('click', () => {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const nameInput = document.getElementById('guestName').value.trim();
        if(nameInput === "") return alert("Cadete, ingresa tu nombre para iniciar la misión.");
        
        guestName = nameInput;
        document.getElementById('screen-intro').classList.add('hidden-screen');
        document.getElementById('game-ui').classList.remove('hidden-screen');
        document.getElementById('hud').style.display = 'block';
        canvas.style.display = 'block';
        
        resizeCanvas();
        isPlaying = true;
        score = 0; phase = 1; asteroids = []; bullets = [];
        update();
    });

    function endGame(choice) {
        isPlaying = false; cancelAnimationFrame(gameLoopId);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let p of particles) {
            ctx.fillStyle = `rgba(255, 255, 255, ${p.life / 100})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }

        setTimeout(() => {
            canvas.style.display = 'none';
            document.getElementById('game-ui').classList.add('hidden-screen');
            showResult(choice);
        }, 1000);
    }

    function showResult(choice) {
        const screenResult = document.getElementById('screen-result');
        screenResult.classList.remove('hidden-screen');

        let msgWhatsApp = "";
        if (choice === 'yes') {
            document.getElementById('result-icon').innerHTML = "🌟";
            document.getElementById('result-title').innerHTML = "<span class='text-green-400'>¡OBJETIVO DESTRUIDO!</span>";
            document.getElementById('result-msg').innerText = `¡Excelente trabajo, Cadete ${guestName}! Prepararemos tu equipo espacial para la gran fiesta de Evan.`;
            msgWhatsApp = `🚀 ¡Misión Aceptada! Soy ${guestName} y CONFIRMO MI ASISTENCIA al cumpleaños espacial de Evan. ¡Allá nos vemos!`;
        } else {
            document.getElementById('result-icon').innerHTML = "🛸";
            document.getElementById('result-title').innerHTML = "<span class='text-red-400'>MISIÓN ABORTADA</span>";
            document.getElementById('result-msg').innerText = `Entendido, Cadete ${guestName}. Te echaremos de menos en la base espacial.`;
            msgWhatsApp = `🛸 Misión Abortada. Soy ${guestName} y tristemente NO PODRÉ ASISTIR al cumpleaños de Evan. ¡Que se diviertan mucho!`;
        }

        document.getElementById('btnConfirm').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msgWhatsApp)}`;
    }
</script>
</body>
</html>
